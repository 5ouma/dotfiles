name: 🔬 Detail Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/detail-test.yml
  pull_request:
    paths:
      - .github/workflows/detail-test.yml
  schedule:
    - cron: 0 0 * * SAT
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ case(startsWith(matrix.os, 'macOS-'), '🍎', startsWith(matrix.os, 'Ubuntu-'), '🐧', '❓') }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-15, macOS-26, Ubuntu-24.04, Ubuntu-24.04-ARM, Ubuntu-26.04, Ubuntu-26.04-ARM]

    steps:
      - name: 🧰 Install dependencies
        if: ${{ startsWith(matrix.os, 'Ubuntu-') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gpg
          sudo install -dm 0755 /etc/apt/keyrings
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/microsoft.gpg
          echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list
          sudo apt-get update
          sudo apt-get install -y build-essential procps curl file git zsh code

      - name: 🍺 Uninstall Homebrew related
        if: ${{ startsWith(matrix.os, 'macOS-') }}
        run: |
          gh api "repos/Homebrew/install/commits/$HOMEBREW_INSTALL_REF" --jq '.commit.verification.verified' | grep -qx true
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/Homebrew/install/contents/uninstall.sh?ref=$HOMEBREW_INSTALL_REF" | /bin/bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_INSTALL_REF: e5b3c5834e3932c8aaa42deef4794076c9b0cbf0
          NONINTERACTIVE: 1

      - name: 📦 Skip mas
        id: skip
        if: ${{ startsWith(matrix.os, 'macOS-') }}
        run: |
          set -o pipefail
          HOMEBREW_BUNDLE_MAS_SKIP="$(curl -s "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/${GITHUB_HEAD_REF:-HEAD}/data/Brewfile" | sed -nE 's/^mas.* ([0-9]+)/\1/gp' | tr '\n' ' ')"
          echo "HOMEBREW_BUNDLE_MAS_SKIP=$HOMEBREW_BUNDLE_MAS_SKIP" | tee -a "$GITHUB_OUTPUT"

      - name: ⚙️ Run setup
        run: |
          curl "https://dot.5ouma.me/${GITHUB_HEAD_REF:-HEAD}" -o "$RUNNER_TEMP/setup"
          shasum -a 256 --check <(curl "$SETUP_SOURCE" | shasum -a 256) <"$RUNNER_TEMP/setup"
          zsh "$RUNNER_TEMP/setup" --yes
        env:
          SETUP_SOURCE: https://raw.githubusercontent.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/setup
          SETUP_SKIP_RESTOREAPPSETTINGS: true
          HOMEBREW_BUNDLE_CASK_SKIP: ${{ case(startsWith(matrix.os, 'Ubuntu-') && endsWith(matrix.os, '-ARM'), 'gitify', '') }}
          HOMEBREW_BUNDLE_MAS_SKIP: ${{ steps.skip.outputs.HOMEBREW_BUNDLE_MAS_SKIP }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐚 Launch new login shell
        run: exec zsh -ilexc exit
