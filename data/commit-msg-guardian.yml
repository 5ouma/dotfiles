version: 1
commit:
  formats:
    - id: conventional
      type:
        allowed:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
      scope:
        brackets: round
        required: true
        structure: slash-separated
      separators: [":", "!:"]
      subject:
        case: upper-first-letter
        min_length: 1
        max_length: 50
      body:
        required: true
        case: upper-first-letter
        max_lines: 1
        max_total_length: 72
        trailing_period: require
