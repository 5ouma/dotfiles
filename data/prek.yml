default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-json
        exclude: Library/Application\ Support/Code/User/(settings|keybindings)\.json$
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8 # frozen: v1.5.6
    hooks:
      - id: remove-tabs
        args: [--whitespaces-count, "2"]
        exclude: ^(.+/)*(.+\.go|go\..+|Makefile|.+\.plist)$
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888 # frozen: v1.52.2
    hooks:
      - id: typos
        stages: [pre-commit]

  - repo: https://github.com/betterleaks/betterleaks
    rev: 39d5bdcf34db54e944facac5cf6e8b03db5e2b99 # frozen: v1.10.1
    hooks:
      - id: betterleaks
        stages: [pre-commit]

  - repo: https://github.com/jdx/jactionlint
    rev: 72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # frozen: v2.6.0
    hooks:
      - id: jactionlint-shellcheck
        args:
          - --profile=pedantic
          - --online=strict
          - --fix
        stages: [pre-commit]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 07f0d02ea1d32edfbe4cbde9de9e9aa0a90ca711 # frozen: 44.251.0
    hooks:
      - id: renovate-config-validator
        language: bun
        language_version: default
        args: [--strict, --no-global]
        stages: [pre-commit]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: df5a947a3af0dba56640e644c6b9316184749168 # frozen: v0.3.4
    hooks:
      - id: rumdl
        args: [--fail-on, warning, --disable, "MD013,MD024,MD033,MD036"]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        description: Static analysis tool for shell scripts
        entry: shellcheck
        language: golang
        additional_dependencies:
          - github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570 # frozen: v0.11.1
        types: [shell]
        args: [-e, "SC1071,SC1072,SC1073,SC1090,SC1091,SC2015,SC2148,SC2154"]
        stages: [pre-commit]

  - repo: https://github.com/AnruKitakaze/commit-msg-guardian
    rev: 35e7c9cd3681495e7ac1636e5f75a9d4bd7c354d # frozen: v1.0.1
    hooks:
      - id: commit-msg-guardian
        shell: sh
        entry: commit-msg-guardian --config="$data/commit-msg-guardian.yml" check-file "$@"
        stages: [commit-msg]

  - repo: https://github.com/5ouma/utils
    rev: ffc700f002ebcb26f8ed359820dead1bc1d43834 # frozen: v0.13.2
    hooks:
      - id: upload-git-commit-notion
        stages: [pre-push]
