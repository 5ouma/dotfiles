default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-json
        exclude: Library/Application\ Support/Code/User/(settings|keybindings)\.json$
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8 # frozen: v1.5.6
    hooks:
      - id: remove-tabs
        args: [--whitespaces-count, "2"]
        exclude: ^(.+/)*(.+\.go|go\..+|Makefile|.+\.plist)$
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: 4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # frozen: v1.52.0
    hooks:
      - id: typos
        stages: [pre-commit]

  - repo: https://github.com/betterleaks/betterleaks
    rev: 8d77e1712fb06fd14444cc648686f1d5655e28a8 # frozen: v1.10.0
    hooks:
      - id: betterleaks
        stages: [pre-commit]

  - repo: https://github.com/jdx/jactionlint
    rev: 9e87e8f34edfc00b849a27807e26eff9d00b936d # frozen: v2.5.0
    hooks:
      - id: jactionlint-shellcheck
        args:
          [
            --profile=pedantic,
            --online=strict,
            --fix,
            --ignore=undocumented-permissions,
            --ignore=unverified-download,
          ]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ghalint
        name: Validate GitHub Actions workflows
        description: Check GitHub Actions workflows for security policy compliance
        entry: ghalint run
        language: golang
        additional_dependencies:
          - github.com/suzuki-shunsuke/ghalint/cmd/ghalint@db3f6a73750c237074a17298010c322ec321e6dc # frozen: v1.6.0
        types: [yaml]
        files: ^\.github/workflows/.+\.ya?ml$
        stages: [pre-commit]
      - id: ghalint-act
        name: Validate GitHub Actions
        description: Check GitHub Actions for security policy compliance
        entry: ghalint act
        language: golang
        additional_dependencies:
          - github.com/suzuki-shunsuke/ghalint/cmd/ghalint@db3f6a73750c237074a17298010c322ec321e6dc # frozen: v1.6.0
        types: [yaml]
        files: ^(.+/)*action\.ya?ml$
        stages: [pre-commit]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: a3807ab9d40bc84e62cf0af0b2ce164548624baf # frozen: 44.222.4
    hooks:
      - id: renovate-config-validator
        language: bun
        language_version: default
        args: [--strict, --no-global]
        stages: [pre-commit]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: b0cff962ee693b9e612c097d22e71e0cba127447 # frozen: v0.3.2
    hooks:
      - id: rumdl
        args: [--fail-on, warning, --disable, "MD013,MD024,MD033,MD036"]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        description: Static analysis tool for shell scripts
        entry: shellcheck
        language: golang
        additional_dependencies:
          - github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570 # frozen: v0.11.1
        types: [shell]
        args: [-e, "SC1071,SC1072,SC1073,SC1090,SC1091,SC2015,SC2148,SC2154"]
        stages: [pre-commit]

  - repo: https://github.com/AnruKitakaze/commit-msg-guardian
    rev: 38489062d9befc453cd8e838651d9b0df8d99f48 # frozen: v0.1.11
    hooks:
      - id: commit-msg-guardian
        args:
          - --scope-rules=allowPathScope
          - --description-rules=capitalized
          - --description-length-limit=50
          - --body-rules=capitalized,oneLine,trailingPeriod
          - --body-length-limit=72
        stages: [commit-msg]

  - repo: https://github.com/5ouma/utils
    rev: b794f89a8b935dc20905edd7654b7fd39d20b119 # frozen: v0.13.1
    hooks:
      - id: upload-git-commit-notion
        stages: [pre-push]
