default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-json
        exclude: Library/Application\ Support/Code/User/(settings|keybindings)\.json$
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8 # frozen: v1.5.6
    hooks:
      - id: remove-tabs
        args: [--whitespaces-count, "2"]
        exclude: ^(.+/)*(.+\.go|go\..+|Makefile|.+\.plist)$
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: d43b6c087ac471e2ea7b8af622ff15f05c0c365b # frozen: v1.50.1
    hooks:
      - id: typos
        stages: [pre-commit]

  - repo: https://github.com/betterleaks/betterleaks
    rev: 5eab48332cc48565864514e3bc6de89df091a7c4 # frozen: v1.8.1
    hooks:
      - id: betterleaks
        stages: [pre-commit]

  - repo: https://github.com/kjanat/actionlint
    rev: 1ab487e641ac26ed42a8a753158033d55eaae2e4 # frozen: v1.14.0
    hooks:
      - id: actionlint
        language: golang
        additional_dependencies:
          - github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570 # frozen: v0.11.1
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pinact
        name: Pin versions of Actions and reusable workflows
        description: Pin versions of GitHub Actions and reusable workflows
        entry: pinact run
        args: [--verify-comment]
        language: golang
        additional_dependencies:
          - github.com/suzuki-shunsuke/pinact/v4/cmd/pinact@b1a554a82ef4f55533237e49c19a24ddf0045100 # frozen: v4.1.1
        types: [yaml]
        files: ^(\.github/workflows/.+|(.+/)*action)\.ya?ml$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ghalint
        name: Validate GitHub Actions workflows
        description: Check GitHub Actions workflows for security policy compliance
        entry: ghalint run
        language: golang
        additional_dependencies:
          - github.com/suzuki-shunsuke/ghalint/cmd/ghalint@050e825989101021ece297e4d2f726f519ba89ee # frozen: v1.5.6
        types: [yaml]
        files: ^\.github/workflows/.+\.ya?ml$
        stages: [pre-commit]
      - id: ghalint-act
        name: Validate GitHub Actions
        description: Check GitHub Actions for security policy compliance
        entry: ghalint act
        language: golang
        additional_dependencies:
          - github.com/suzuki-shunsuke/ghalint/cmd/ghalint@050e825989101021ece297e4d2f726f519ba89ee # frozen: v1.5.6
        types: [yaml]
        files: ^(.+/)*action\.ya?ml$
        stages: [pre-commit]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce # frozen: v1.30.0
    hooks:
      - id: zizmor
        args: [--no-config]
        stages: [pre-commit]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 8f4d39781f3a8b4fee31fc6c3186dd68743f87a1 # frozen: 44.65.5
    hooks:
      - id: renovate-config-validator
        language: bun
        language_version: default
        args: [--strict, --no-global]
        stages: [pre-commit]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 9ebb29f982d88ed2cb80409361f06ad8260041f1 # frozen: v0.2.67
    hooks:
      - id: rumdl
        args: [--fail-on, warning, --disable, "MD013,MD024,MD033,MD036"]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        description: Static analysis tool for shell scripts
        entry: shellcheck
        language: golang
        additional_dependencies:
          - github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570 # frozen: v0.11.1
        types: [shell]
        args: [-e, "SC1071,SC1072,SC1073,SC1090,SC1091,SC2015,SC2148,SC2154"]
        stages: [pre-commit]

  - repo: https://github.com/AnruKitakaze/commit-msg-guardian
    rev: 38489062d9befc453cd8e838651d9b0df8d99f48 # frozen: v0.1.11
    hooks:
      - id: commit-msg-guardian
        args:
          - --scope-rules=allowPathScope
          - --description-rules=capitalized
          - --description-length-limit=50
          - --body-rules=capitalized,oneLine,trailingPeriod
          - --body-length-limit=72
        stages: [commit-msg]

  - repo: https://github.com/5ouma/utils
    rev: b70e56a2b532a6ab38bb6d1f6529835285109138 # frozen: v0.12.5
    hooks:
      - id: upload-git-commit-notion
        stages: [pre-push]
